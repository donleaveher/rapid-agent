<svg xmlns="http://www.w3.org/2000/svg" width="960" height="812" viewBox="0 0 960 812" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrL" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#0e7490"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="812" fill="#ffffff"/>

  <!-- ===== TASK PLANE ===== -->
  <rect x="20" y="40" width="920" height="196" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="40" y="66" font-size="14" font-weight="700" fill="#1e40af">TASK PLANE — answer a question</text>

  <!-- flow boxes -->
  <g font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">
    <rect x="40"  y="96" width="120" height="54" rx="8" fill="#1d4ed8"/><text x="100" y="128">User query</text>
    <rect x="188" y="96" width="120" height="54" rx="8" fill="#3b82f6"/><text x="248" y="128">Router</text>
    <rect x="336" y="96" width="120" height="54" rx="8" fill="#3b82f6"/><text x="396" y="121">Schema</text><text x="396" y="137">Linker</text>
    <rect x="484" y="96" width="120" height="54" rx="8" fill="#3b82f6"/><text x="544" y="121">SQL</text><text x="544" y="137">Generator</text>
    <rect x="632" y="96" width="120" height="54" rx="8" fill="#3b82f6"/><text x="692" y="128">Executor</text>
    <rect x="780" y="96" width="120" height="54" rx="8" fill="#1d4ed8"/><text x="840" y="128">Answer</text>
  </g>
  <g stroke="#475569" stroke-width="2" marker-end="url(#arr)" fill="none">
    <path d="M160,123 L186,123"/>
    <path d="M308,123 L334,123"/>
    <path d="M456,123 L482,123"/>
    <path d="M604,123 L630,123"/>
    <path d="M752,123 L778,123"/>
  </g>

  <!-- accents: memory + repair -->
  <g font-size="11" fill="#ffffff" text-anchor="middle">
    <rect x="468" y="178" width="152" height="46" rx="8" fill="#8b5cf6"/>
    <text x="544" y="197" font-weight="600">History Memory</text><text x="544" y="212">reuse · retrieval few-shots</text>
    <rect x="636" y="178" width="120" height="46" rx="8" fill="#f59e0b"/>
    <text x="696" y="197" font-weight="600">Repair (ReAct)</text><text x="696" y="212">error · empty · check</text>
  </g>
  <g stroke="#8b5cf6" stroke-width="2" marker-end="url(#arr)" fill="none"><path d="M544,178 L544,152"/></g>
  <g stroke="#f59e0b" stroke-width="2" marker-end="url(#arr)" fill="none"><path d="M692,150 L692,176"/></g>

  <!-- ===== PHOENIX BAND ===== -->
  <rect x="20" y="262" width="920" height="54" rx="12" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="480" y="285" text-anchor="middle" font-size="14" font-weight="700" fill="#4338ca">Arize Phoenix</text>
  <text x="480" y="303" text-anchor="middle" font-size="12" fill="#6366f1">OpenInference traces  ·  Experiments  ·  MCP server</text>
  <!-- traces up -->
  <g stroke="#0e7490" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrL)" fill="none"><path d="M300,262 L300,236"/></g>
  <text x="312" y="252" font-size="11" fill="#0e7490">spans</text>

  <!-- ===== IMPROVEMENT PLANE ===== -->
  <rect x="20" y="338" width="920" height="150" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="520" y="362" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">IMPROVEMENT PLANE — get better over time (commit-if-better)</text>

  <g font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">
    <rect x="40"  y="392" width="150" height="56" rx="8" fill="#059669"/><text x="115" y="417">Optimizer</text><text x="115" y="433" font-size="11" font-weight="400">reads via MCP</text>
    <rect x="214" y="392" width="150" height="56" rx="8" fill="#10b981"/><text x="289" y="417">Cluster</text><text x="289" y="433" font-size="11" font-weight="400">failure modes</text>
    <rect x="388" y="392" width="166" height="56" rx="8" fill="#10b981"/><text x="471" y="414">Propose candidates</text><text x="471" y="432" font-size="11" font-weight="400">few-shots · rules · reflection</text>
    <rect x="578" y="392" width="150" height="56" rx="8" fill="#10b981"/><text x="653" y="417">Validate + A/B</text><text x="653" y="433" font-size="11" font-weight="400">held-out</text>
    <rect x="752" y="392" width="160" height="56" rx="8" fill="#059669"/><text x="832" y="417">commit-if-better</text><text x="832" y="433" font-size="11" font-weight="400">keep only if it wins</text>
  </g>
  <g stroke="#475569" stroke-width="2" marker-end="url(#arr)" fill="none">
    <path d="M190,420 L212,420"/>
    <path d="M364,420 L386,420"/>
    <path d="M554,420 L576,420"/>
    <path d="M728,420 L750,420"/>
  </g>

  <!-- MCP read: phoenix -> optimizer -->
  <g stroke="#0e7490" stroke-width="2" marker-end="url(#arrL)" fill="none"><path d="M115,316 L115,390"/></g>
  <text x="128" y="331" font-size="11" fill="#0e7490">MCP: read own failures</text>

  <!-- commit -> task plane (return loop, right margin) -->
  <path d="M912,420 C 948,420 948,123 902,123" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="950" y="270" font-size="11" fill="#059669" text-anchor="middle" transform="rotate(90 950 270)">commit improved config → next runs</text>

  <!-- ===== SELF-IMPROVEMENT CURVE (full-width panel below the planes) ===== -->
  <rect x="20" y="516" width="920" height="240" rx="12" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="40" y="546" font-size="15" font-weight="700" fill="#065f46">Execution accuracy ↑ — self-improvement (held-out · 100 q / 20 DBs)</text>

  <!-- legend (one row) -->
  <g font-size="11">
    <line x1="40"  y1="566" x2="64"  y2="566" stroke="#059669" stroke-width="3.5"/><text x="70"  y="570" fill="#065f46">Gemini flash +17%</text>
    <line x1="240" y1="566" x2="264" y2="566" stroke="#f59e0b" stroke-width="3.5"/><text x="270" y="570" fill="#b45309">Gemini pro +0% (ceiling)</text>
    <line x1="470" y1="566" x2="494" y2="566" stroke="#0891b2" stroke-width="3.5"/><text x="500" y="570" fill="#0e7490">DeepSeek flash +14%</text>
    <line x1="690" y1="566" x2="714" y2="566" stroke="#7c3aed" stroke-width="3.5"/><text x="720" y="570" fill="#6d28d9">DeepSeek pro +15%</text>
  </g>

  <!-- gridlines -->
  <g stroke="#eef2f7" stroke-width="1">
    <line x1="120" y1="591" x2="900" y2="591"/>
    <line x1="120" y1="639" x2="900" y2="639"/>
  </g>
  <!-- axes -->
  <g stroke="#94a3b8" stroke-width="1">
    <line x1="120" y1="579" x2="120" y2="719"/>
    <line x1="120" y1="719" x2="900" y2="719"/>
  </g>
  <g font-size="10" fill="#94a3b8" text-anchor="end">
    <text x="112" y="583">90%</text>
    <text x="112" y="643">75%</text>
    <text x="112" y="723">55%</text>
  </g>
  <g font-size="11" fill="#475569" text-anchor="middle">
    <text x="180" y="737">r0</text>
    <text x="413" y="737">r1</text>
    <text x="646" y="737">r2</text>
    <text x="880" y="737">r3</text>
  </g>

  <!-- Gemini flash: 60,77,77,77 (y=719-(v-55)*4) -->
  <polyline points="180,699 413,631 646,631 880,631" fill="none" stroke="#059669" stroke-width="3"/>
  <g fill="#059669"><circle cx="180" cy="699" r="4"/><circle cx="413" cy="631" r="4"/><circle cx="646" cy="631" r="4"/><circle cx="880" cy="631" r="4"/></g>
  <!-- Gemini pro: 87 flat (near ceiling) -->
  <polyline points="180,591 413,591 646,591 880,591" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <g fill="#f59e0b"><circle cx="180" cy="591" r="4"/><circle cx="413" cy="591" r="4"/><circle cx="646" cy="591" r="4"/><circle cx="880" cy="591" r="4"/></g>
  <!-- DeepSeek flash: 65,75,75,79 -->
  <polyline points="180,679 413,639 646,639 880,623" fill="none" stroke="#0891b2" stroke-width="3"/>
  <g fill="#0891b2"><circle cx="180" cy="679" r="4"/><circle cx="413" cy="639" r="4"/><circle cx="646" cy="639" r="4"/><circle cx="880" cy="623" r="4"/></g>
  <!-- DeepSeek pro: 63,75,75,78 -->
  <polyline points="180,687 413,639 646,639 880,627" fill="none" stroke="#7c3aed" stroke-width="3"/>
  <g fill="#7c3aed"><circle cx="180" cy="687" r="4"/><circle cx="413" cy="639" r="4"/><circle cx="646" cy="639" r="4"/><circle cx="880" cy="627" r="4"/></g>

  <!-- end value labels -->
  <g font-size="11" font-weight="700">
    <text x="910" y="595" fill="#b45309">87</text>
    <text x="910" y="620" fill="#0e7490">79</text>
    <text x="910" y="648" fill="#065f46">77</text>
  </g>

  <!-- ===== DEPLOYMENT / RUNTIME PLATFORM ===== -->
  <rect x="20" y="766" width="920" height="34" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="480" y="787" text-anchor="middle" font-size="12" fill="#475569"><tspan font-weight="700" fill="#334155">Deployed on Google Cloud Run</tspan>   ·   SQL generation on Vertex AI (gemini-3.5-flash)   ·   traced to Arize Phoenix Cloud</text>
</svg>
